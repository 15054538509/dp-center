brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 每天凌晨 4 点清理过期消息
deleteWhen = 04
# 消息保留 48 小时
fileReservedTime = 48
# 异步复制、异步刷盘（本地学习环境性能优先）
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 自动创建 Topic / 消费组，省去手动建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
# 监听容器内所有网卡
listenPort = 10911
namesrvAddr = rocketmq-namesrv:9876
# 延迟消息档位：第 15 档 = 15 分钟（代码 ORDER_TIMEOUT_DELAY_LEVEL=15 依赖此配置）
# 默认档位：1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
# Broker 对外暴露的地址（宿主机 Java 进程直连时如需 NAT 可改为 127.0.0.1）
brokerIP1 = 127.0.0.1
